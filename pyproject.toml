[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-content-factory"
version = "1.2.1"
description = "Sequential multi-agent AI content creation platform with human-in-the-loop workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "certifi>=2024.2.2",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "Pillow>=10,<13",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
alignment = ["faster-whisper>=1.1,<2"]
browser = ["playwright>=1.50,<2"]
channel = ["manim>=0.19,<0.22", "playwright>=1.50,<2"]
voice = ["piper-tts>=1.3,<2", "onnxruntime>=1.20", "kokoro-onnx>=0.6.1,<1", "soundfile>=0.13,<1"]
research = ["yt-dlp>=2025.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "mypy>=1.17",
]

[project.scripts]
content-factory-channel = "content_factory.channel.__main__:main"
content-factory = "content_factory.main:main"
content-factory-local-video = "content_factory.local_video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RET",
    "RUF",
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: requires a running external service"]
addopts = "-m 'not integration'"

[tool.setuptools.package-data]
content_factory = ["config/*.json"]
