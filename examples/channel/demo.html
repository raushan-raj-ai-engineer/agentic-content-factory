<!doctype html><html lang="en"><meta charset="utf-8"><title>Local workflow demo</title><style>
body{margin:0;background:#0b1220;color:#dbeafe;font:24px system-ui}main{max-width:1080px;margin:60px auto}h1{font-size:48px;color:white}small{color:#5eead4}input,button{font:inherit;padding:16px;border-radius:10px;border:1px solid #475569;background:#1e293b;color:white}button{cursor:pointer;background:#115e59}#items{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:36px}.card{padding:24px;background:#1e293b;border-radius:16px}.card b{color:#5eead4}label{display:block;margin-bottom:12px}#count{margin-top:24px;color:#94a3b8}</style><main><small>REAL BROWSER RECORDING / LOCAL SAMPLE APP</small><h1>Find the right automation task</h1><label for="search">Search by name or category</label><input id="search" placeholder="Try Python"><button id="sort">Sort by name</button><div id="count"></div><div id="items"></div></main><script>
const tasks=[{name:'UI regression',tag:'Playwright'},{name:'API checks',tag:'Python'},{name:'CSV validation',tag:'Python'},{name:'Login smoke test',tag:'Playwright'}];let sorted=false;function render(){const q=document.querySelector('#search').value.toLowerCase();let found=tasks.filter(t=>(t.name+' '+t.tag).toLowerCase().includes(q));if(sorted)found.sort((a,b)=>a.name.localeCompare(b.name));document.querySelector('#items').innerHTML=found.map(t=>`<div class="card"><b>${t.tag}</b><p>${t.name}</p></div>`).join('');document.querySelector('#count').textContent=found.length+' matching tasks';}document.querySelector('#search').addEventListener('input',render);document.querySelector('#sort').onclick=()=>{sorted=true;render()};render();</script></html>
